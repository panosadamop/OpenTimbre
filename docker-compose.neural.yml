services:
  studio:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports: ["8080:80"]
  synthesis:
    build:
      context: ./services/ai
      dockerfile: Dockerfile.neural
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - .env
    environment:
      AUTH_DB_PATH: /app/output/auth.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - synthesis-output:/app/output
volumes:
  synthesis-output:
